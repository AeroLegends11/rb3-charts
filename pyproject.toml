[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "rb3-charts"
version = "0.1.0"
description = "Local, precision-oriented Rock Band 3 chart authoring"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "librosa==0.10.2.post1", "soundfile==0.13.1", "mido>=1.3,<2", "imageio-ffmpeg==0.6.0", "onnxruntime>=1.17", "pretty_midi>=0.2.10", "mir_eval>=0.7", "resampy>=0.4", "mutagen>=1.47", "PySide6>=6.8", "PyYAML>=6", "setuptools>=68,<81"]

[project.scripts]
rb3-charts = "rb3charts.cli:main"

[tool.setuptools.packages.find]
include = ["rb3charts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
